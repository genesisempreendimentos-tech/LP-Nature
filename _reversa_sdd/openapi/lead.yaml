openapi: 3.0.3
info:
  title: Nature Residencial — Lead API
  version: 0.2.0
  description: |
    Contrato validado pelo stakeholder (Bruno, 2026-09-10).

    Front legado atual ainda nao implementa — submit faz console.log.
    Backend alvo Neon (tabela compartilhada); sync CVCRM fora de escopo.

    pagina_origem neste funil: "Pagina de Vendas"
    (DEFAULT da coluna: "Site Institucional" para o outro site).
servers:
  - url: /api
    description: Mesmo origin / BFF (Astro ou equivalente)
paths:
  /leads:
    post:
      operationId: createLead
      summary: Criar lead inicial (form publico)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreate'
            example:
              nome: Maria Silva
              email: maria@exemplo.com
              telefone: "21999999999"
              interesse_planta: "66,68 m2"
      responses:
        '201':
          description: Lead criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadCreateResponse'
        '400':
          description: Payload invalido
  /leads/{id}:
    patch:
      operationId: patchLeadField
      summary: Atualizar campo do perfil estendido (token obrigatorio)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadPatch'
      responses:
        '200':
          description: Campo atualizado
        '400':
          description: field fora da allowlist ou value invalido
        '401':
          description: token invalido para este lead
        '404':
          description: lead nao encontrado
components:
  schemas:
    LeadCreate:
      type: object
      additionalProperties: false
      required: [nome, email, telefone]
      properties:
        nome:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        telefone:
          type: string
          pattern: '^\d{11}$'
          description: Somente 11 digitos (DDD+numero), sem +55
        interesse_planta:
          type: string
          description: Metragem selecionada no CTA de planta
        consentimento_lgpd:
          type: boolean
          description: Obrigatorio em producao; URL da politica ainda inexistente
    LeadCreateResponse:
      type: object
      required: [id, token]
      properties:
        id:
          type: string
        token:
          type: string
          description: lead_token opaco — nao e o id
    LeadPatch:
      type: object
      additionalProperties: false
      required: [token, field, value]
      properties:
        token:
          type: string
        field:
          type: string
          enum:
            - relationship_status
            - children_status
            - profession
            - monthly_investment
            - sexo
            - current_city
            - birth_date
            - profile_type
          description: Allowlist fechada (8 campos listados pelo stakeholder)
        value: {}
