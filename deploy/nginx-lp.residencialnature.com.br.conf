# Copie para: /etc/nginx/sites-available/lp.residencialnature.com.br
# Ative com:
#   sudo ln -sf /etc/nginx/sites-available/lp.residencialnature.com.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requer certificado já emitido:
#   sudo certbot --nginx -d lp.residencialnature.com.br
#
# API (PM2 nature-api): 127.0.0.1:3103
# NÃO use a porta de outros projetos (3100 Solar do Bosque, 3051 institucional, 3111 Feirão).

server {
    listen 80;
    listen [::]:80;
    server_name lp.residencialnature.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lp.residencialnature.com.br;

    ssl_certificate /etc/letsencrypt/live/lp.residencialnature.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lp.residencialnature.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/lp-nature/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # API desta LP → PM2 na porta 3103 (rotas /api/* sem reescrita)
    location /api/ {
        proxy_pass http://127.0.0.1:3103;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /_astro/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
